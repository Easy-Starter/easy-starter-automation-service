[project]
name = "easy-starter-automation-service"
version = "0.1.0"
description = "Production-capable automation service starter for webhooks, scheduled jobs, background tasks, and integrations."
readme = "README.md"
authors = [
    { name = "Fonij2002", email = "fonij2002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1,<2",
    "celery[redis]>=5,<6",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2.14.2",
    "redis>=6.4.0",
    "sqlalchemy>=2,<3",
    "structlog>=26.1.0",
]

[project.scripts]
easy-starter-automation-service = "easy_starter_automation_service:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"